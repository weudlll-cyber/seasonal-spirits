<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seasonal Spirits — Phase 0 viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #hud {
        position: fixed;
        top: 76px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid #22303c;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre;
      }
      canvas {
        display: block;
      }
      /* The admin panel (admin-panel.ts): "Next match" — choose a game, set its values, start —
         and "Running match", only with the server's DEV_TUNING. Never taller than the window
         below the clock and never wider than it: it scrolls inside, so every row and button
         stays reachable (FIX 2026-11-17-5). */
      #tuning {
        position: fixed;
        top: 76px;
        right: 12px;
        width: 340px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 88px);
        box-sizing: border-box;
        overflow-y: auto;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.9); /* the field shows through little: readable on a phone */
        border: 1px solid #22303c;
        border-radius: 6px;
        font-size: 13px;
      }
      #tuning h2 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      #tuning label {
        display: grid;
        grid-template-columns: 1fr;
        margin-bottom: 8px;
      }
      #tuning output {
        color: #9fb3c8;
      }
      #tuning summary {
        cursor: pointer;
        font-weight: bold;
        margin: 6px 0;
      }
      #tuning small {
        color: #9fb3c8;
      }
      #tuning .presets input {
        width: 100%;
        box-sizing: border-box;
      }
      #tuning p.status {
        margin: 4px 0 0;
        color: #ff9b9b;
      }
      #tuning button {
        font: inherit;
        color: #e6edf3;
        background: #17222c;
        border: 1px solid #3a4b5a;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #tuning .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      #tuning .tabs button {
        flex: 1;
        padding: 8px;
      }
      #tuning .tabs button.active,
      #tuning .games button.chosen {
        border-color: #ffd54f;
        font-weight: bold;
      }
      #tuning .games {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      #tuning .games button {
        min-height: 56px;
        font-size: 14px;
      }
      #tuning button.start {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        border-color: #ffd54f;
      }
      #tuning label.switch {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 8px 0;
      }
      #tuning .running {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <pre id="hud">connecting…</pre>
    <section id="tuning" hidden></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
