<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seasonal Spirits — Phase 0 viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0b0f14;
        color: #e6edf3;
        font-family: system-ui, sans-serif;
        overflow: hidden;
      }
      #hud {
        position: fixed;
        top: 76px;
        left: 12px;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid #22303c;
        border-radius: 6px;
        font-size: 13px;
        line-height: 1.4;
        white-space: pre;
      }
      canvas {
        display: block;
      }
      /* The admin panel: settings and presets (admin-panel.ts), only with the server's DEV_TUNING.
         Never taller than the window below the clock and never wider than it: it scrolls inside,
         so every slider and the copy line stay reachable (FIX 2026-11-17-5). */
      #tuning {
        position: fixed;
        top: 76px;
        right: 12px;
        width: 300px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 88px);
        box-sizing: border-box;
        overflow-y: auto;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid #22303c;
        border-radius: 6px;
        font-size: 13px;
      }
      #tuning h2 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      #tuning label {
        display: grid;
        grid-template-columns: 1fr;
        margin-bottom: 8px;
      }
      #tuning output {
        color: #9fb3c8;
      }
      #tuning summary {
        cursor: pointer;
        font-weight: bold;
        margin: 6px 0;
      }
      #tuning small {
        color: #9fb3c8;
      }
      #tuning .presets input {
        width: 100%;
        box-sizing: border-box;
      }
      #tuning p {
        margin: 4px 0 0;
        color: #ff9b9b;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <pre id="hud">connecting…</pre>
    <section id="tuning" hidden></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
