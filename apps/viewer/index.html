<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Seasonal Spirits — Phase 0 viewer</title>
    <!-- The kit's theme before the first paint (vite.config.ts themeInit). -->
    <script src="theme-init.js"></script>
    <style>
      /* The frame takes the kit's look (owner decision 2026-11-20, @seasonal/kit tokens.css and
         fonts.css, imported in main.ts): the network numbers on the kit's surface with the
         island's ink outline and drop shadow, light and dark on <html data-theme> (the kit's
         theme, render look-switch.ts), Luxora Grotesk for every page text, Fredoka on the canvas;
         the admin panel keeps its own dark colours. */
      :root {
        --ink: #2b2140;
        --panel: var(--color-surface);
        --panel-text: var(--color-text);
      }
      :root[data-theme='dark'] {
        --ink: #120e22;
      }
      :root[data-theme='dark'] body {
        background: #1d1b3f;
      }
      #look {
        font: inherit;
        cursor: pointer;
        color: var(--panel-text);
        background: var(--panel);
        border: 2.5px solid var(--ink);
        box-shadow: 3px 3px 0 var(--ink);
      }
      /* The Light/Dark switch (render look-switch.ts): a small pill at the top right in the
         clock's row, its knob left with a sun in Light, right with a moon in Dark; the clock's
         pill keeps clear of it (main.ts SWITCH_ROOM; NIGHT 2026-11-19: the same size as the
         client's). */
      #look {
        position: fixed;
        top: 4px;
        right: 8px;
        width: 46px;
        height: 26px;
        padding: 0;
        border-radius: 999px;
      }
      #look::after {
        content: '\2600';
        position: absolute;
        top: 1px;
        left: 2px;
        width: 19px;
        height: 19px;
        line-height: 19px;
        font-size: 12px;
        border-radius: 50%;
        background: #ffe073;
        color: #2b2140;
        border: 1.5px solid var(--ink);
        transition: left 0.2s;
      }
      :root[data-theme='dark'] #look::after {
        content: '\263E';
        left: 21px;
        background: #fff3c4;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #9edcf5;
        color: #e6edf3;
        font-family: var(--font-family);
        overflow: hidden;
      }
      /* The network numbers at the bottom left, over the rock and the clouds, not the field
         (NIGHT 2026-11-19: the viewer's camera now fills the height like the client's). Luxora
         Grotesk, not the <pre>'s monospace (DECISIONS D10); each value after one tab, so the tab
         stop past the longest label keeps the values in one column. */
      #hud {
        font-family: inherit;
        tab-size: 9em;
        position: fixed;
        bottom: 12px;
        left: 12px;
        padding: 8px 12px;
        color: var(--panel-text);
        background: var(--panel);
        border: 2.5px solid var(--ink);
        border-radius: 12px;
        box-shadow: 4px 4px 0 var(--ink);
        font-size: 14px; /* the 14 px floor (owner decision 2026-11-21) */
        line-height: 1.4;
        white-space: pre;
      }
      canvas {
        display: block;
      }
      /* The admin panel (admin-panel.ts): "Next match" — choose a game, set its values, start —
         and "Running match", only with the server's DEV_TUNING. Never taller than the window
         below the clock and never wider than it: it scrolls inside, so every row and button
         stays reachable (FIX 2026-11-17-5). */
      #tuning {
        position: fixed;
        top: 44px;
        right: 12px;
        width: 340px;
        max-width: calc(100vw - 24px);
        max-height: calc(100vh - 56px);
        box-sizing: border-box;
        overflow-y: auto;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.9); /* the field shows through little: readable on a phone */
        border: 1px solid #22303c;
        border-radius: 6px;
        font-size: 14px; /* no panel text under the 14 px floor (review 2026-11-22, phone) */
      }
      #tuning h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      #tuning label {
        display: grid;
        grid-template-columns: 1fr;
        margin-bottom: 8px;
      }
      #tuning output {
        color: #9fb3c8;
      }
      #tuning summary {
        cursor: pointer;
        font-weight: bold;
        margin: 6px 0;
      }
      /* The hints ("now", "next match") set apart by colour, not by a smaller size. */
      #tuning small {
        color: #9fb3c8;
        font-size: inherit;
      }
      /* The browser sets form fields to 13.33 px of their own; here they take the panel's. */
      #tuning select,
      #tuning input {
        font: inherit;
      }
      #tuning .presets input {
        width: 100%;
        box-sizing: border-box;
      }
      #tuning p.status {
        margin: 4px 0 0;
        color: #ff9b9b;
      }
      #tuning button {
        font: inherit;
        color: #e6edf3;
        background: #17222c;
        border: 1px solid #3a4b5a;
        border-radius: 6px;
        padding: 4px 8px;
        cursor: pointer;
      }
      #tuning .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 8px;
      }
      #tuning .tabs button {
        flex: 1;
        padding: 8px;
      }
      #tuning .tabs button.active,
      #tuning .games button.chosen {
        border-color: #ffd54f;
        font-weight: bold;
      }
      #tuning .games {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      #tuning .games button {
        min-height: 56px;
        font-size: 14px;
      }
      #tuning button.start {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        border-color: #ffd54f;
      }
      #tuning label.switch {
        display: flex;
        gap: 6px;
        align-items: center;
        margin: 8px 0;
      }
      #tuning .running {
        font-weight: bold;
      }
      /* Folded (panel-fold.ts, 2026-11-19): only the small tab shows, the field's corner is free. */
      #tuning .fold {
        float: right;
      }
      #tuning.folded {
        width: auto;
        padding: 4px;
      }
      #tuning.folded > :not(.fold) {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <button id="look" type="button" aria-label="Dark mode" aria-pressed="false"></button>
    <pre id="hud">connecting…</pre>
    <section id="tuning" hidden></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
