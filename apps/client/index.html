<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Seasonal Sumo</title>
    <!-- The kit's theme before the first paint (vite.config.ts themeInit). -->
    <script src="theme-init.js"></script>
    <!-- The frame's own styles, in cascade order (src/styles/); the kit's come from main.ts and
         frame/Frame.tsx. -->
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/controls.css" />
    <link rel="stylesheet" href="/src/styles/hud.css" />
    <link rel="stylesheet" href="/src/styles/screens.css" />
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="stick"><div id="knob"></div></div>
    <div id="actions">
      <button id="jump" type="button" hidden>Jump <span class="key">(Shift)</span></button>
      <button id="dash" type="button" hidden>Dash <span class="key">(Space)</span></button>
    </div>
    <div id="flash"></div>
    <div id="announce" role="status" hidden></div>
    <div id="notice" role="status" hidden></div>
    <div id="band">
      <!-- The kit's game bar (src/frame/Bar.tsx) -->
      <div id="band-top"></div>
      <div id="scores" aria-label="Per team" hidden></div>
      <div id="hint" role="status" hidden></div>
    </div>
    <div id="help" role="dialog" aria-label="How to play" hidden></div>
    <div id="start" aria-hidden="true">
      <h1>Seasonal Party</h1>
      <canvas id="start-island" width="340" height="230"></canvas>
      <p>Joining the match …</p>
    </div>
    <!-- The kit's result frame (src/frame/ResultCard.tsx) -->
    <div id="result" hidden></div>
    <!-- The kit's docked chat, website mode only (src/frame/Dock.tsx) -->
    <div id="dock"></div>
    <!-- The React root of the frame; its parts render into the containers above (Frame.tsx) -->
    <div id="frame"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
