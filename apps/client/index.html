<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Seasonal Sumo</title>
    <!-- The kit's theme before the first paint (vite.config.ts themeInit). -->
    <script src="theme-init.js"></script>
    <style>
      /* The frame around the play field takes the kit's look (owner decision 2026-11-20,
         @seasonal/kit tokens.css and fonts.css, imported in main.ts): its surface, text and scrim
         colours, light and dark on <html data-theme> (the kit's theme, render look-switch.ts),
         and Luxora Grotesk for every frame text. The Sky Island stays inside the play field: the
         sky, the ink outlines and drop shadows, Fredoka on the canvas. */
      :root {
        --ink: #2b2140;
        --panel: var(--color-surface);
        --panel-text: var(--color-text);
        --muted: var(--color-text-muted);
        --sky: #9edcf5;
        --alert: #cc4858; /* white on it 4.53:1 (NIGHT 2026-11-19; #ff5a6e was 3.0:1) */
        --dash: #ffc23c;
        --jump: #4cc2ff;
        --veil: var(--color-scrim);
        --drop: 4px 4px 0 var(--ink);
        --rest: #ffffff; /* the Dash and Jump buttons' part still charging */
      }
      /* Dark: the island at night; the frame's colours follow the kit's dark tokens. */
      :root[data-theme='dark'] {
        --ink: #120e22;
        --sky: #1d1b3f;
        --rest: #d9d4ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--sky);
        color: var(--panel-text);
        font-family: var(--font-family);
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
      }
      button,
      .link {
        font: inherit;
        font-weight: 600;
        color: var(--panel-text);
        background: var(--panel);
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        box-shadow: 3px 3px 0 var(--ink);
        padding: 10px 16px;
        text-decoration: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* Jump left of Dash, both at the bottom right (JUMP 2026-11-17). */
      #actions {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      #help {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--veil);
        overflow: auto;
      }
      #help ol {
        list-style: none;
        padding: 0;
        margin: 0 0 10px;
      }
      #help li {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 8px 0;
      }
      #help li svg {
        flex-shrink: 0;
      }
      /* The card scrolls with a finger (the page itself takes no touch gestures) and keeps its
         scroll to itself; "×" at its top right stays there as it scrolls (help.ts). */
      #help .card {
        touch-action: pan-y;
        overscroll-behavior: contain;
      }
      #help .close {
        position: sticky;
        top: 0;
        float: right;
        z-index: 1;
        width: 40px;
        height: 40px;
        margin: -8px -10px 0 8px;
        border: 3px solid var(--ink);
        border-radius: 50%;
        background: var(--panel);
        color: var(--panel-text);
        font: 700 24px/1 var(--font-family);
        cursor: pointer;
      }
      /* The help card while more of it lies below: a fade over its bottom edge, held there as the
         card scrolls, gone at the end (help.ts; owner 2026-11-20). It spans the card's padding. */
      #help .card.more::after {
        content: '';
        position: sticky;
        bottom: -18px;
        display: block;
        height: 48px;
        margin: -48px -20px 0;
        background: linear-gradient(transparent, var(--panel));
        pointer-events: none;
      }
      /* The left half belongs to the joystick thumb; the buttons stay in the right half. */
      body.touch #actions {
        max-width: calc(50vw - 24px);
      }
      /* Dash and Jump: big round buttons in their colours; the colour fills round them while the
         cooldown runs (--ready 0 … 1); Jump smaller, so both fit a phone's right half. Their
         text stays dark on both colours and on white. */
      #dash,
      #jump {
        -webkit-tap-highlight-color: transparent;
        width: 96px;
        height: 96px;
        padding: 0;
        border-radius: 50%;
        font-size: 18px;
        border: 3px solid var(--ink);
        box-shadow: var(--drop);
        color: #2b2140;
        background: conic-gradient(var(--fill) calc(var(--ready, 1) * 360deg), var(--rest) 0);
        opacity: 0.75;
      }
      #dash {
        --fill: var(--dash);
      }
      #jump {
        --fill: var(--jump);
        width: 68px;
        height: 68px;
        font-size: 14px;
      }
      #dash.ready,
      #jump.ready {
        opacity: 1;
      }
      .key {
        color: #4a4060;
        font-weight: 500;
        font-size: 12px;
        display: block;
      }
      body.touch .key {
        display: none;
      }
      #stick {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 50%;
        height: 60%;
        display: none;
      }
      body.touch #stick {
        display: block;
      }
      /* A spectator has no controls (it sends nothing after its hello). */
      body.spectating #stick,
      body.spectating #actions {
        display: none;
      }
      #stick::before,
      #knob {
        position: fixed;
        left: calc(var(--ox, 90px) - 30px);
        top: calc(var(--oy, 80%) - 30px);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        pointer-events: none;
      }
      #stick::before {
        content: '';
        left: calc(var(--ox, 90px) - 60px);
        top: calc(var(--oy, 80%) - 60px);
        width: 120px;
        height: 120px;
        border: 3px solid rgba(43, 33, 64, 0.35);
        background: rgba(255, 255, 255, 0.2);
      }
      #knob {
        background: rgba(255, 255, 255, 0.75);
        border: 3px solid var(--ink);
        box-sizing: border-box;
      }
      /* The halving, the bombs' blast and the match end (hud.ts): a red banner, slightly tilted,
         at the top edge of the play area right under the band — never over the middle of the
         field (NIGHT 2026-11-18); with the flash and the tone, the clock's countdown stays above
         it. White text on the red at 4.5:1 or more (--alert), with an ink edge. */
      #announce {
        position: fixed;
        top: 122px;
        left: 50%;
        width: max-content;
        /* Never wider than the screen minus 16 px, padding and border included; on a phone the
           text shrinks to at most two lines (banner-fit.ts, 2026-11-19: it ran past both edges). */
        box-sizing: border-box;
        max-width: calc(100vw - 16px);
        transform: translateX(-50%) rotate(-2deg);
        padding: 6px 18px;
        text-align: center;
        font-size: clamp(15px, 4vw, 22px);
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow:
          -1.5px -1.5px 0 #2b2140,
          1.5px -1.5px 0 #2b2140,
          -1.5px 1.5px 0 #2b2140,
          1.5px 1.5px 0 #2b2140;
        background: var(--alert);
        border: 3px solid var(--ink);
        border-radius: 14px;
        box-shadow: var(--drop);
        pointer-events: none;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #flash.go {
        animation: flash 450ms ease-out;
      }
      @keyframes flash {
        from {
          opacity: 0.7;
        }
        to {
          opacity: 0;
        }
      }
      /* Under the canvas season clock (36 px, render clock.ts CLOCK_HEIGHT): the band, 78 px (scene.ts BAND_HEIGHT; 68
         px before the kit's game bar, whose phone targets are 44 px), with the kit's game bar
         (frame/Bar.tsx: the team line, the lives, the corner buttons) and below it the team
         scores. No control sits
         on the field (owner's play test 2026-11-15); the team line shrinks or ends in "…"
         before it reaches the buttons. */
      #band {
        position: fixed;
        top: 36px;
        left: 0;
        right: 0;
        height: 78px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
      }
      #band-top {
        min-width: 0;
      }
      #band-top .sk-game-bar {
        gap: 8px;
      }
      /* The corner on the right; the bar has no panel buttons. */
      #band-top .sk-bar-fact:has(> #corner) {
        margin-left: auto;
      }
      #band-top .sk-bar-actions {
        display: none;
      }
      /* A team's colour dot before its name (the team line, the score chips). */
      .dot::before {
        content: '';
        display: inline-block;
        width: 0.7em;
        height: 0.7em;
        margin-right: 0.35em;
        border-radius: 50%;
        background: var(--team);
        border: 2px solid var(--ink);
        vertical-align: -0.05em;
      }
      /* The team scores: one white pill per team with its colour dot, name and score, in sumo its
         ghosts still in; the leader outlined in its colour (scores.ts). Four fit a 390 px
         phone. */
      #scores {
        display: flex;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      #scores .score {
        flex: 1;
        text-align: center;
        padding: 1px 4px;
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 999px;
        box-shadow: var(--drop);
        white-space: nowrap;
      }
      #scores .score.lead {
        outline: 4px solid var(--team);
      }
      #team {
        flex: 0 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: clamp(15px, 4.6vw, 20px);
        font-weight: 700;
        padding: 1px 12px;
        background: var(--panel);
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        box-shadow: var(--drop);
      }
      /* The own lives next to the team line (lives.ts): red circles, a lost one white. */
      #hearts {
        display: flex;
        align-items: center;
        gap: 3px;
        flex: none;
        font-size: 14px;
        font-weight: 700;
        color: var(--panel-text);
      }
      #hearts .heart {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--alert);
        border: 2px solid var(--ink);
        transition: background-color 0.8s;
      }
      #hearts .heart.lost {
        background: #ffffff;
      }
      /* King of the Season: "Stand in the zone to score" while the own ghost is outside the zone
         (zone-hint.ts), a small pill in its own row under the band (the field starts below it,
         scene.ts fieldTop) in the team line's style; hidden while a banner shows. */
      #announce:not([hidden]) ~ #band #hint {
        visibility: hidden;
      }
      #hint {
        position: fixed;
        top: 115px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
        padding: 1px 10px;
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 999px;
        box-shadow: var(--drop);
        pointer-events: none;
      }
      #notice {
        position: fixed;
        top: 178px; /* below the banner (#announce) */
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        box-shadow: var(--drop);
        padding: 8px 14px;
        max-width: 90vw;
        text-align: center;
      }
      /* A spectator's notice: a pill like #hint in the row under the band (scene.ts fieldTop),
         never over the back fence or the zone (2026-11-19); hidden while a banner shows. */
      #announce:not([hidden]) ~ #notice.row {
        visibility: hidden;
      }
      #notice.row {
        top: 115px;
        white-space: nowrap;
        font-size: 13px;
        font-weight: 600;
        padding: 1px 10px;
        border-width: 2px;
        border-radius: 999px;
      }
      /* The Sound switch as a round note wherever the kit's bar takes its phone layout (44 px
         buttons, no words shown: under 900 px wide or upright, kit bar.css), struck through when
         off; its words stay for screen readers (NIGHT 2026-11-19; piece 4 2026-11-21). The gaps
         narrower there, so the team line keeps its room beside the 44 px buttons. */
      @media (max-width: 899px), (orientation: portrait) {
        #band-top .sk-game-bar,
        #band-top #corner {
          gap: 4px;
        }
        #corner #mute {
          font-size: 0;
        }
        #mute::before {
          content: '\266A';
          font-size: 15px;
        }
        #mute[aria-pressed='true']::before {
          text-decoration: line-through;
        }
      }
      @media (max-width: 480px) {
        #team .lead,
        #scores .name {
          display: none;
        }
        /* A little smaller on a phone, so "You fell — back in 3" fits beside the lives. */
        #team {
          font-size: 15px;
          padding: 1px 8px;
        }
        #hearts .heart {
          width: 11px;
          height: 11px;
        }
      }
      /* The corner (frame/Bar.tsx): the kit's theme toggle and bar buttons ("?", the sound), in
         the kit's look, not the island's ink. */
      #corner {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #corner .sk-bar-button,
      #corner .sk-theme-toggle {
        padding-block: 0;
        box-shadow: none;
        font-weight: 600;
      }
      #corner .sk-theme-toggle {
        padding: 0;
      }
      /* The dev build's "Admin" link (frame/Bar.tsx; chain 2026-11-21): small, plain, in the
         corner. */
      #corner #admin {
        font-size: 12px;
        font-weight: 400;
        color: inherit;
      }
      #result {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        padding: 12px;
        box-sizing: border-box;
        background: var(--veil);
        overflow: auto;
      }
      /* The result in the kit's result frame (frame/ResultCard.tsx): its first part fitted to the
         screen (the kit's --fit, never below the 14 px text floor), what follows scrolls. */
      #result .sk-result {
        width: min(860px, 100%);
        margin: auto;
        color: var(--panel-text);
      }
      #result .sk-result-first,
      #result .sk-result-more {
        background: var(--panel);
        font-size: max(var(--sk-floor-text), calc(var(--fit, 1) * 16px));
      }
      #result h3 {
        margin: 0 0 6px;
        font-size: max(var(--sk-floor-text), calc(var(--fit, 1) * 17px));
      }
      #result p {
        margin: 0;
      }
      #result ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #result li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 0;
      }
      /* The start screen (start.ts): the title in a white pill over a small floating island with
         the four seasons' characters, while the client joins; it lets every touch through and
         fades out (NIGHT 2026-11-19). */
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-around;
        background: var(--sky);
        pointer-events: none;
        transition: opacity 0.4s;
      }
      #start.gone {
        opacity: 0;
      }
      #start h1 {
        margin: 0;
        padding: 6px 22px;
        font-size: clamp(30px, 9vw, 52px);
        font-weight: 700;
        color: var(--panel-text);
        background: var(--panel);
        border: 3px solid var(--ink);
        border-radius: 999px;
        box-shadow: var(--drop);
      }
      /* The start screen's canvas fills the screen behind its title (start.ts). */
      #start canvas {
        position: absolute;
        inset: 0;
        z-index: -1;
      }
      #podium {
        display: block;
        margin: 0 auto;
        max-width: 100%;
        height: max(76px, calc(var(--fit, 1) * 190px));
        width: auto;
      }
      #start p {
        margin: 0;
        padding: 3px 12px;
        color: var(--panel-text);
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 999px;
      }
      @media (prefers-reduced-motion: reduce) {
        #start {
          transition: none;
        }
      }
      #result[hidden],
      [hidden] {
        display: none !important;
      }
      .card {
        background: var(--panel);
        color: var(--panel-text);
        border: 3px solid var(--ink);
        border-radius: 18px;
        box-shadow: var(--drop);
        padding: 18px 20px;
        width: min(440px, 92vw);
        max-height: 92vh;
        box-sizing: border-box;
        overflow: auto;
      }
      .card h2,
      .card h3 {
        margin: 0 0 8px;
      }
      .card ol {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
      }
      .card li {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      #bridge {
        border-top: 2px solid var(--ink);
        margin-top: 12px;
        padding-top: 12px;
      }
      #bridge .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .small {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="stick"><div id="knob"></div></div>
    <div id="actions">
      <button id="jump" type="button" hidden>Jump <span class="key">(Shift)</span></button>
      <button id="dash" type="button" hidden>Dash <span class="key">(Space)</span></button>
    </div>
    <div id="flash"></div>
    <div id="announce" role="status" hidden></div>
    <div id="notice" role="status" hidden></div>
    <div id="band">
      <!-- The kit's game bar (src/frame/Bar.tsx) -->
      <div id="band-top"></div>
      <div id="scores" aria-label="Per team" hidden></div>
      <div id="hint" role="status" hidden></div>
    </div>
    <div id="help" role="dialog" aria-label="How to play" hidden></div>
    <div id="start" aria-hidden="true">
      <h1>Seasonal Party</h1>
      <canvas id="start-island" width="340" height="230"></canvas>
      <p>Joining the match …</p>
    </div>
    <!-- The kit's result frame (src/frame/ResultCard.tsx) -->
    <div id="result" hidden></div>
    <!-- The kit's docked chat, website mode only (src/frame/Dock.tsx) -->
    <div id="dock"></div>
    <!-- The React root of the frame; its parts render into the containers above (Frame.tsx) -->
    <div id="frame"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
