<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Seasonal Spirits</title>
    <style>
      :root {
        color-scheme: dark;
        --text: #e6edf3;
        --muted: #8b98a5;
        --panel: rgba(5, 8, 11, 0.86);
        --line: #22303c;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05080b;
        color: var(--text);
        font-family: system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
      }
      button,
      .link {
        font: inherit;
        color: var(--text);
        background: #17222c;
        border: 1px solid #3a4b5a;
        border-radius: 10px;
        padding: 12px 16px;
        text-decoration: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #actions {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
      }
      #steal {
        width: 96px;
        height: 96px;
        border-radius: 50%;
        font-weight: bold;
      }
      #shrine {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }
      #shrine button {
        font-weight: bold;
        text-align: left;
      }
      /* The left half belongs to the joystick thumb; the buttons stay in the right half. */
      body.touch #actions {
        max-width: calc(50vw - 24px);
      }
      #secure {
        border-color: #4caf50;
      }
      #swap {
        border-color: #f9a825;
      }
      .key {
        color: var(--muted);
        font-weight: normal;
      }
      body.touch .key {
        display: none;
      }
      #stick {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 50%;
        height: 60%;
        display: none;
      }
      body.touch #stick {
        display: block;
      }
      /* A spectator has no controls (it sends nothing after its hello). */
      body.spectating #stick,
      body.spectating #actions {
        display: none;
      }
      #stick::before,
      #knob {
        position: fixed;
        left: calc(var(--ox, 90px) - 30px);
        top: calc(var(--oy, 80%) - 30px);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        pointer-events: none;
      }
      #stick::before {
        content: '';
        left: calc(var(--ox, 90px) - 60px);
        top: calc(var(--oy, 80%) - 60px);
        width: 120px;
        height: 120px;
        border: 2px solid rgba(230, 237, 243, 0.25);
      }
      #knob {
        background: rgba(230, 237, 243, 0.35);
      }
      #announce {
        position: fixed;
        top: 32%;
        left: 0;
        right: 0;
        text-align: center;
        font-size: clamp(28px, 7vw, 64px);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-shadow: 0 0 24px rgba(0, 0, 0, 0.9);
        pointer-events: none;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #flash.go {
        animation: flash 450ms ease-out;
      }
      @keyframes flash {
        from {
          opacity: 0.7;
        }
        to {
          opacity: 0;
        }
      }
      /* Under the canvas season clock (64 px): the band, 40 px (scene.ts BAND_HEIGHT), with the
         team line and the corner buttons. No control sits on the field (owner's play test
         2026-11-15); the team line shrinks or ends in "…" before it reaches the buttons. */
      #band {
        position: fixed;
        top: 64px;
        left: 0;
        right: 0;
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: rgba(5, 8, 11, 0.92);
      }
      #team {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: clamp(16px, 5vw, 22px);
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      #notice {
        position: fixed;
        top: 114px;
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 14px;
        max-width: 90vw;
        text-align: center;
      }
      @media (max-width: 480px) {
        #team .lead {
          display: none;
        }
      }
      #corner {
        margin-left: auto;
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      #corner button {
        padding: 4px 8px;
        font-size: 12px;
      }
      body.spectating #view {
        display: none;
      }
      #result {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 11, 0.7);
        overflow: auto;
      }
      #result[hidden],
      [hidden] {
        display: none !important;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 18px 20px;
        width: min(440px, 92vw);
        max-height: 92vh;
        overflow: auto;
      }
      .card h2,
      .card h3 {
        margin: 0 0 8px;
      }
      .card ol {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
      }
      .card li {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      #bridge {
        border-top: 1px solid var(--line);
        margin-top: 12px;
        padding-top: 12px;
      }
      #bridge .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .small {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="stick"><div id="knob"></div></div>
    <div id="actions">
      <div id="shrine" hidden>
        <button id="secure" type="button">Secure</button>
        <button id="swap" type="button">Swap</button>
        <span class="small key">1 Secure · 2 Swap</span>
      </div>
      <button id="steal" type="button" hidden>Steal <span class="key">(Space)</span></button>
    </div>
    <div id="flash"></div>
    <div id="announce" role="status" hidden></div>
    <div id="notice" role="status" hidden></div>
    <div id="band">
      <div id="team" hidden></div>
      <div id="corner">
        <button id="view" type="button">View: Near</button>
        <button id="mute" type="button" aria-pressed="false">Sound on</button>
      </div>
    </div>
    <div id="result" hidden>
      <div class="card">
        <h2>Result</h2>
        <p id="result-place"></p>
        <h3>Teams</h3>
        <ol id="result-teams"></ol>
        <h3>Players</h3>
        <ol id="result-players"></ol>
        <p id="result-next" class="small"></p>
        <div id="bridge">
          <p id="bridge-text"></p>
          <div class="buttons">
            <a id="start-here" class="link" target="_blank" rel="noopener noreferrer">Start here</a>
            <a id="simulator" class="link" target="_blank" rel="noopener noreferrer"
              >Try the simulator</a
            >
          </div>
          <p class="small">No financial advice</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
