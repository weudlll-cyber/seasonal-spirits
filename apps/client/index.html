<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>Seasonal Sumo</title>
    <style>
      /* Sky Island look (owner's choice 2026-11-18): white panels with an ink outline and an ink
         drop shadow over the sky, Fredoka (bundled, @fontsource/fredoka). Every colour is a
         variable here, so the dark mode only swaps them. */
      :root {
        color-scheme: light;
        --ink: #2b2140;
        --panel: #ffffff;
        --panel-text: #2b2140;
        --muted: #5b5270;
        --sky: #9edcf5;
        --alert: #cc4858; /* white on it 4.53:1 (NIGHT 2026-11-19; #ff5a6e was 3.0:1) */
        --dash: #ffc23c;
        --jump: #4cc2ff;
        --veil: rgba(43, 33, 64, 0.45);
        --drop: 4px 4px 0 var(--ink);
        --rest: #ffffff; /* the Dash and Jump buttons' part still charging */
      }
      /* Dark (the switch): the same look at night; every colour above is swapped here. */
      body.dark {
        color-scheme: dark;
        --ink: #120e22;
        --panel: #2b2550;
        --panel-text: #f3f0ff;
        --muted: #c9c3ff;
        --sky: #1d1b3f;
        --veil: rgba(10, 8, 25, 0.6);
        --rest: #d9d4ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--sky);
        color: var(--panel-text);
        font-family: Fredoka, system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
      }
      canvas {
        display: block;
      }
      button,
      .link {
        font: inherit;
        font-weight: 600;
        color: var(--panel-text);
        background: var(--panel);
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        box-shadow: 3px 3px 0 var(--ink);
        padding: 10px 16px;
        text-decoration: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      /* The Light/Dark switch (render look-switch.ts): a small pill in the band's corner, its
         knob left with a sun in Light, right with a moon in Dark (NIGHT 2026-11-19: moved off the
         top right, where it left the clock's line too little room on a phone). */
      #corner #look {
        position: relative;
        width: 46px;
        height: 26px;
        padding: 0;
        border-radius: 999px;
      }
      #look::after {
        content: '\2600';
        position: absolute;
        top: 1px;
        left: 2px;
        width: 19px;
        height: 19px;
        line-height: 19px;
        font-size: 12px;
        border-radius: 50%;
        background: #ffe073;
        color: #2b2140;
        border: 1.5px solid var(--ink);
        transition: left 0.2s;
      }
      body.dark #look::after {
        content: '\263E';
        left: 21px;
        background: #fff3c4;
      }
      /* Jump left of Dash, both at the bottom right (JUMP 2026-11-17). */
      #actions {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      #help {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--veil);
        overflow: auto;
      }
      #help ol {
        list-style: none;
        padding: 0;
        margin: 0 0 10px;
      }
      #help li {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 8px 0;
      }
      #help li svg {
        flex-shrink: 0;
      }
      /* The left half belongs to the joystick thumb; the buttons stay in the right half. */
      body.touch #actions {
        max-width: calc(50vw - 24px);
      }
      /* Dash and Jump: big round buttons in their colours; the colour fills round them while the
         cooldown runs (--ready 0 … 1); Jump smaller, so both fit a phone's right half. Their
         text stays dark on both colours and on white. */
      #dash,
      #jump {
        -webkit-tap-highlight-color: transparent;
        width: 96px;
        height: 96px;
        padding: 0;
        border-radius: 50%;
        font-size: 18px;
        border: 3px solid var(--ink);
        box-shadow: var(--drop);
        color: #2b2140;
        background: conic-gradient(var(--fill) calc(var(--ready, 1) * 360deg), var(--rest) 0);
        opacity: 0.75;
      }
      #dash {
        --fill: var(--dash);
      }
      #jump {
        --fill: var(--jump);
        width: 68px;
        height: 68px;
        font-size: 14px;
      }
      #dash.ready,
      #jump.ready {
        opacity: 1;
      }
      .key {
        color: #4a4060;
        font-weight: 500;
        font-size: 12px;
        display: block;
      }
      body.touch .key {
        display: none;
      }
      #stick {
        position: fixed;
        left: 0;
        bottom: 0;
        width: 50%;
        height: 60%;
        display: none;
      }
      body.touch #stick {
        display: block;
      }
      /* A spectator has no controls (it sends nothing after its hello). */
      body.spectating #stick,
      body.spectating #actions {
        display: none;
      }
      #stick::before,
      #knob {
        position: fixed;
        left: calc(var(--ox, 90px) - 30px);
        top: calc(var(--oy, 80%) - 30px);
        width: 60px;
        height: 60px;
        border-radius: 50%;
        pointer-events: none;
      }
      #stick::before {
        content: '';
        left: calc(var(--ox, 90px) - 60px);
        top: calc(var(--oy, 80%) - 60px);
        width: 120px;
        height: 120px;
        border: 3px solid rgba(43, 33, 64, 0.35);
        background: rgba(255, 255, 255, 0.2);
      }
      #knob {
        background: rgba(255, 255, 255, 0.75);
        border: 3px solid var(--ink);
        box-sizing: border-box;
      }
      /* The halving, the bombs' blast and the match end (hud.ts): a red banner, slightly tilted,
         at the top edge of the play area right under the band — never over the middle of the
         field (NIGHT 2026-11-18); with the flash and the tone, the clock's countdown stays above
         it. White text on the red at 4.5:1 or more (--alert), with an ink edge. */
      #announce {
        position: fixed;
        top: 112px;
        left: 50%;
        width: max-content;
        max-width: 90vw;
        transform: translateX(-50%) rotate(-2deg);
        padding: 6px 18px;
        text-align: center;
        font-size: clamp(15px, 4vw, 22px);
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow:
          -1.5px -1.5px 0 #2b2140,
          1.5px -1.5px 0 #2b2140,
          -1.5px 1.5px 0 #2b2140,
          1.5px 1.5px 0 #2b2140;
        background: var(--alert);
        border: 3px solid var(--ink);
        border-radius: 14px;
        box-shadow: var(--drop);
        pointer-events: none;
      }
      #flash {
        position: fixed;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #flash.go {
        animation: flash 450ms ease-out;
      }
      @keyframes flash {
        from {
          opacity: 0.7;
        }
        to {
          opacity: 0;
        }
      }
      /* Under the canvas season clock (36 px, render clock.ts CLOCK_HEIGHT): the band, 68 px (scene.ts BAND_HEIGHT), with the
         team line and the corner buttons, and below them the team scores. No control sits
         on the field (owner's play test 2026-11-15); the team line shrinks or ends in "…"
         before it reaches the buttons. */
      #band {
        position: fixed;
        top: 36px;
        left: 0;
        right: 0;
        height: 68px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 6px;
        padding: 0 10px;
      }
      #band-top {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      /* A team's colour dot before its name (the team line, the score chips). */
      .dot::before {
        content: '';
        display: inline-block;
        width: 0.7em;
        height: 0.7em;
        margin-right: 0.35em;
        border-radius: 50%;
        background: var(--team);
        border: 2px solid var(--ink);
        vertical-align: -0.05em;
      }
      /* The team scores: one white pill per team with its colour dot, name and score, in sumo its
         ghosts still in; the leader outlined in its colour (scores.ts). Four fit a 390 px
         phone. */
      #scores {
        display: flex;
        gap: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      #scores .score {
        flex: 1;
        text-align: center;
        padding: 1px 4px;
        background: var(--panel);
        border: 2px solid var(--ink);
        border-radius: 999px;
        box-shadow: var(--drop);
        white-space: nowrap;
      }
      #scores .score.lead {
        outline: 4px solid var(--team);
      }
      #team {
        flex: 0 1 auto;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: clamp(15px, 4.6vw, 20px);
        font-weight: 700;
        padding: 1px 12px;
        background: var(--panel);
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        box-shadow: var(--drop);
      }
      /* The own lives next to the team line (lives.ts): red circles, a lost one white. */
      #hearts {
        display: flex;
        align-items: center;
        gap: 3px;
        flex: none;
        font-size: 14px;
        font-weight: 700;
        color: var(--panel-text);
      }
      #hearts .heart {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--alert);
        border: 2px solid var(--ink);
        transition: background-color 0.8s;
      }
      #hearts .heart.lost {
        background: #ffffff;
      }
      #notice {
        position: fixed;
        top: 168px; /* below the banner (#announce) */
        left: 50%;
        transform: translateX(-50%);
        background: var(--panel);
        border: 2.5px solid var(--ink);
        border-radius: 14px;
        box-shadow: var(--drop);
        padding: 8px 14px;
        max-width: 90vw;
        text-align: center;
      }
      @media (max-width: 480px) {
        #team .lead,
        #scores .name {
          display: none;
        }
        /* The Sound switch as a round note on a phone, struck through when off (its words stay
           for screen readers): room in the band for the Light/Dark switch (NIGHT 2026-11-19). */
        #corner #mute {
          font-size: 0;
          width: 30px;
          height: 26px;
          padding: 0;
        }
        #mute::before {
          content: '\266A';
          font-size: 15px;
        }
        #mute[aria-pressed='true']::before {
          text-decoration: line-through;
        }
        /* A little smaller on a phone, so "You fell — back in 3" fits beside the lives. */
        #team {
          font-size: 15px;
          padding: 1px 8px;
        }
        #hearts .heart {
          width: 11px;
          height: 11px;
        }
      }
      #corner {
        margin-left: auto;
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      #corner button {
        padding: 3px 10px;
        font-size: 13px;
      }
      #result {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--veil);
        overflow: auto;
      }
      #result[hidden],
      [hidden] {
        display: none !important;
      }
      .card {
        background: var(--panel);
        color: var(--panel-text);
        border: 3px solid var(--ink);
        border-radius: 18px;
        box-shadow: var(--drop);
        padding: 18px 20px;
        width: min(440px, 92vw);
        max-height: 92vh;
        box-sizing: border-box;
        overflow: auto;
      }
      .card h2,
      .card h3 {
        margin: 0 0 8px;
      }
      .card ol {
        list-style: none;
        margin: 0 0 12px;
        padding: 0;
      }
      .card li {
        display: flex;
        justify-content: space-between;
        padding: 2px 0;
      }
      #bridge {
        border-top: 2px solid var(--ink);
        margin-top: 12px;
        padding-top: 12px;
      }
      #bridge .buttons {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .small {
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <canvas id="map"></canvas>
    <div id="stick"><div id="knob"></div></div>
    <div id="actions">
      <button id="jump" type="button" hidden>Jump <span class="key">(Shift)</span></button>
      <button id="dash" type="button" hidden>Dash <span class="key">(Space)</span></button>
    </div>
    <div id="flash"></div>
    <div id="announce" role="status" hidden></div>
    <div id="notice" role="status" hidden></div>
    <div id="band">
      <div id="band-top">
        <div id="team" class="dot" hidden></div>
        <div id="hearts" hidden></div>
        <div id="corner">
          <button id="look" type="button" aria-label="Dark mode" aria-pressed="false"></button>
          <button id="help-open" type="button" aria-label="How to play">?</button>
          <button id="mute" type="button" aria-pressed="false">Sound on</button>
        </div>
      </div>
      <div id="scores" aria-label="Per team" hidden></div>
    </div>
    <div id="help" role="dialog" aria-label="How to play" hidden></div>
    <div id="result" hidden>
      <div class="card">
        <h2>Result</h2>
        <p id="result-place"></p>
        <div id="result-awards-box">
          <h3>Awards</h3>
          <ol id="result-awards"></ol>
        </div>
        <h3>Teams</h3>
        <ol id="result-teams"></ol>
        <h3>Players</h3>
        <ol id="result-players"></ol>
        <p id="result-next" class="small"></p>
        <div id="bridge">
          <p id="bridge-text"></p>
          <div class="buttons">
            <a id="start-here" class="link" target="_blank" rel="noopener noreferrer">Start here</a>
            <a id="simulator" class="link" target="_blank" rel="noopener noreferrer"
              >Try the simulator</a
            >
          </div>
          <p class="small">No financial advice</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
