# Seasonal Spirits — CI: the full "pnpm verify", run here instead of on the owner's PC.
# Jobs on every branch push and every pull request to master: verify, dependencies and the
# browser tests (e2e); once a week the dependencies job alone, so a new advisory against an
# unchanged lockfile is seen without a push (DECISIONS D4, audit 2026-11-22 P5). The toolchain
# versions come from package.json "packageManager" and .nvmrc (shared setup in
# .github/actions/setup); the runner image is named, not "latest".
name: CI

# Markdown under docs/ and reports/ cannot change a check's answer (Prettier ignores
# reports/; docs/ is formatted locally by pnpm verify:changed). Root Markdown files
# (CONCEPT.md, README.md, CLAUDE.md) are not listed, so they still run the format check.
on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**/*.md', 'reports/**/*.md']
  pull_request:
    branches: [master]
    paths-ignore: ['docs/**/*.md', 'reports/**/*.md']
  schedule:
    # Mondays 03:41 UTC, on the default branch: the weekly security scan.
    - cron: '41 3 * * 1'

permissions:
  contents: read

# Scanner image pinned by digest, like the actions by commit SHA (same as seasonal-mini-games);
# Renovate updates it through the regex manager in renovate.json (scripts/repo-config.test.ts).
env:
  OSV_SCANNER_IMAGE: ghcr.io/google/osv-scanner:v2.7.0@sha256:4f3b7e2c64b9d38a5febc5a7e4a3dfef1d1362f726dea7a2ef4762b46469fcd0

concurrency:
  # One group per branch and event, so a push and its PR do not cancel each other.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Every merge commit on master must get its own finished run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The job token stays off the disk: nothing after the checkout pushes.
        with:
          persist-credentials: false
      # pnpm, Node and the install; restores the pnpm store cache keyed on the lockfile.
      - uses: ./.github/actions/setup
      # Format check, lint, typecheck, tests.
      - run: pnpm verify
      # The viewer's build carries no admin panel (audit 2026-11-22 I1).
      - run: pnpm --filter @seasonal-spirits/viewer build:check

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The job token stays off the disk: nothing after the checkout pushes.
        with:
          persist-credentials: false
      # Any known vulnerability in the lockfile fails the job unless osv-scanner.toml holds an
      # accepted, dated exception for it. No install needed: the lockfile is the input.
      - name: osv-scanner (lockfile)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$OSV_SCANNER_IMAGE" scan source \
            --config=osv-scanner.toml --lockfile=pnpm-lock.yaml

  e2e:
    # The player client in Chromium at desktop and phone size against its own short-match
    # server (apps/client/e2e/playwright.config.ts).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The job token stays off the disk: nothing after the checkout pushes.
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Playwright browser (Chromium)
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # On a failure: the traces and page snapshots of the failed tests, for a week.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
